# Baseline generated by scitrera-repo-tools `generate-ci-gha`. This repository
# calls its complete reusable test/release gate before publishing and retains
# quoted version expansions required by actionlint's shellcheck integration.

name: Build & push Docker images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 0.1.58 or v0.1.58). Empty produces sha-only tags.'
        required: false
        type: string

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/test-go.yml

  build-agent-harness-linux-amd64:
    name: Build agent-harness (linux/amd64)
    runs-on: ubuntu-latest
    needs: [ tests ]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Read image version from versions.yaml
        id: imgver
        run: |
          VER=$(uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --print-version agent-harness-go)
          MAJOR_MINOR="$(printf '%s\n' "$VER" | cut -d. -f1-2)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Compute workflow_dispatch version tags
        id: ver
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          MAJOR_MINOR="$(printf '%s\n' "$VER" | cut -d. -f1-2)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/scitrera/agent-harness
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
            type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.major_minor }},enable=${{ steps.ver.outputs.major_minor != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.version != '' }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/scitrera/agent-harness,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agent-harness-linux-amd64
          cache-to: type=gha,mode=max,scope=agent-harness-linux-amd64
  build-agent-harness-linux-arm64:
    name: Build agent-harness (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: [ tests ]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Read image version from versions.yaml
        id: imgver
        run: |
          VER=$(uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --print-version agent-harness-go)
          MAJOR_MINOR="$(printf '%s\n' "$VER" | cut -d. -f1-2)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Compute workflow_dispatch version tags
        id: ver
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          MAJOR_MINOR="$(printf '%s\n' "$VER" | cut -d. -f1-2)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/scitrera/agent-harness
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
            type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.major_minor }},enable=${{ steps.ver.outputs.major_minor != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.version != '' }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/scitrera/agent-harness,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agent-harness-linux-arm64
          cache-to: type=gha,mode=max,scope=agent-harness-linux-arm64
  merge-agent-harness:
    name: Merge agent-harness multi-arch manifest
    runs-on: ubuntu-latest
    needs: [ build-agent-harness-linux-amd64, build-agent-harness-linux-arm64 ]
    permissions:
      contents: read
      packages: write
    outputs:
      base-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Read image version from versions.yaml
        id: imgver
        run: |
          VER=$(uvx --from 'scitrera-repo-tools==0.1.30' sync-versions --print-version agent-harness-go)
          MAJOR_MINOR="$(printf '%s\n' "$VER" | cut -d. -f1-2)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Compute workflow_dispatch version tags
        id: ver
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          MAJOR_MINOR="$(printf '%s\n' "$VER" | cut -d. -f1-2)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/scitrera/agent-harness
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.imgver.outputs.version }},enable=${{ steps.imgver.outputs.version != '' }}
            type=raw,value=${{ steps.imgver.outputs.major_minor }},enable=${{ steps.imgver.outputs.major_minor != '' }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.major_minor }},enable=${{ steps.ver.outputs.major_minor != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.version != '' }}

      - name: Create multi-arch manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          eval "docker buildx imagetools create $TAGS \
            ghcr.io/scitrera/agent-harness@${{ needs.build-agent-harness-linux-amd64.outputs.digest }} \
            ghcr.io/scitrera/agent-harness@${{ needs.build-agent-harness-linux-arm64.outputs.digest }}"
