# Baseline generated by scitrera-repo-tools `generate-ci-gha`, with the
# repository-specific hardening jobs called out below. Refresh the baseline
# deliberately and preserve those jobs.

name: Test (Go)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  # github.ref is stable across pushes to the same PR (refs/pull/N/merge), so
  # this still cancels a superseded run when you push again — the case where
  # cancelling is the right outcome. It deliberately does NOT collapse the
  # push and pull_request runs of one commit: that duplicate is avoided with
  # ci.push_branches instead, because a cancelled run reports as cancelled
  # rather than as success.
  group: test-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Repository-specific hardening layered on top of the generated Go jobs.
  # Preserve these jobs when regenerating this workflow from versions.yaml.
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan Git history
        run: gitleaks git --redact --no-banner .

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint GitHub Actions workflows
        run: actionlint

  release-readiness:
    name: Release readiness
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: ./go.sum

      - name: Install release audit tools
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/go-licenses/v2@v2.0.1

      - name: Verify standalone, secret-free, licensed release inputs
        run: ./scripts/check-release.sh

  test-agent-harness-go:
    name: Test agent-harness-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: ./go.sum

      - name: go vet
        run: go vet ./...
        working-directory: .

      - name: go test
        run: go test -race -count=1 ./...
        working-directory: .
  lint-agent-harness-go:
    name: Lint agent-harness-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: ./go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: 'v2.11.4'
          working-directory: .
          args: --timeout=5m
  security-agent-harness-go:
    name: govulncheck agent-harness-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: ./go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        working-directory: .
        env:
          IGNORED_ADVISORIES: ""
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/govulncheck-agent-harness-go.json"
          # Exit status is non-zero when anything is found; the JSON is what we
          # judge on, so do not let `set -e` stop us before reading it.
          govulncheck -format json ./... > "$report"
          status=$?
          if [ ! -s "$report" ]; then
            echo "::error::govulncheck produced no output (exit $status)"
            exit 1
          fi

          # A finding with a function in its trace is reachable from this module.
          called=$(jq -r 'select(has("finding")) | .finding
                          | select((.trace[0].function? // null) != null) | .osv'                      "$report" | sort -u)

          fail=0
          for vuln in $called; do
            if printf '%s\n' "$IGNORED_ADVISORIES" | tr '[:space:]' '\n' | grep -qx "$vuln"; then
              echo "::notice::$vuln reachable but allow-listed (see ci.go.govulncheck_ignore)"
            else
              echo "::error::$vuln is reachable and not allow-listed — see https://pkg.go.dev/vuln/$vuln"
              fail=1
            fi
          done

          # An allow-list entry that no longer matches anything is stale: the
          # dependency was fixed or dropped, and the waiver should go with it.
          for vuln in $IGNORED_ADVISORIES; do
            if ! printf '%s\n' "$called" | grep -qx "$vuln"; then
              echo "::warning::$vuln is allow-listed but no longer reachable; drop it from ci.go.govulncheck_ignore"
            fi
          done

          [ "$fail" = 0 ]
