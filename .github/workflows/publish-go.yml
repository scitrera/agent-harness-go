# Baseline generated by scitrera-repo-tools `generate-ci-gha`, with the
# repository-specific license packaging called out below. Refresh the baseline
# deliberately and preserve that packaging.

name: Publish (Go)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-go.yml

  # Repository-specific license packaging layered on top of the generated
  # release workflow. Preserve this job when regenerating from versions.yaml.
  third-party-licenses:
    name: Collect third-party licenses
    runs-on: ubuntu-latest
    needs: [ tests ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: ./go.sum

      - name: Collect licenses
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          go-licenses save ./cmd/agent-harness \
            --ignore github.com/scitrera/agent-harness-go \
            --save_path third_party_licenses

      - name: Upload licenses
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: third_party_licenses/
          if-no-files-found: error

  build-agent-harness:
    name: Build agent-harness (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [ tests, third-party-licenses ]
    strategy:
      # One unsupported target must not withhold the assets for every other
      # platform; the release job needs what did build.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: ./go.sum

      - name: Download third-party licenses
        uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: ${{ runner.temp }}/third_party_licenses

      - name: Build
        working-directory: .
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # A dispatch run has no tag to read a version from, and must still
          # produce something identifiable rather than an asset called "".
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA:0:7}"
          fi
          COMMIT="$GITHUB_SHA"
          bin="agent-harness"
          if [ "$GOOS" = windows ]; then bin="$bin.exe"; fi
          stage="$RUNNER_TEMP/stage-agent-harness"
          rm -rf "$stage"
          mkdir -p "$stage"
          go build -trimpath -ldflags "-s -w -X github.com/scitrera/agent-harness-go/pkg/version.Commit=$COMMIT" -o "$stage/$bin" ./cmd/agent-harness
          cp "$GITHUB_WORKSPACE/LICENSE" "$stage/"
          cp "$GITHUB_WORKSPACE/NOTICE" "$stage/"
          cp "$GITHUB_WORKSPACE/README.md" "$stage/"
          cp -R "$RUNNER_TEMP/third_party_licenses" "$stage/third_party_licenses"
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          base="agent-harness_${VERSION}_${GOOS}_${GOARCH}"
          case "$GOOS" in
            windows) (cd "$stage" && zip -qr "$dist/$base.zip" .) ;;
            *) tar -czf "$dist/$base.tar.gz" -C "$stage" . ;;
          esac
          ls -l "$dist"

      - name: Upload agent-harness (${{ matrix.goos }}/${{ matrix.goarch }})
        uses: actions/upload-artifact@v7
        with:
          name: binaries-agent-harness-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          # An empty upload here would surface as a release that is simply
          # missing a platform, which nobody notices until someone downloads it.
          if-no-files-found: error

  github-release:
    name: Attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: [ build-agent-harness ]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/

      - name: Checksums
        run: |
          set -euo pipefail
          # Written outside dist/ first: `sha256sum ./* > dist/checksums.txt`
          # truncates the file before the glob expands, so it would list itself.
          (cd dist && sha256sum ./*) > checksums.txt
          mv checksums.txt dist/
          cat dist/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
